# Perfil de teste: banco H2 em memória, isolado do arquivo usado
# em desenvolvimento local. O Flyway roda as mesmas migrations
# contra este banco descartável a cada execução dos testes.
spring.datasource.url=jdbc:h2:mem:petfamily_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

jwt.secret=test-secret-key-not-for-production-use-only-min-32-bytes
jwt.expiration-ms=3600000
