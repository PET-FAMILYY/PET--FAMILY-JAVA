# ===================================
# Perfil PROD ? banco COMPARTILHADO (PostgreSQL)
# ===================================
# Nenhum valor sensível tem default: se a variável não existir, a
# aplicação NÃO sobe (fail-fast) em vez de rodar com segredo fraco.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console H2 nunca existe em prod
spring.h2.console.enabled=false

# Sem segredo/origem padrão em produção
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Swagger desligado por padrão em prod (ligue com SWAGGER_ENABLED=true se precisar)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

logging.level.org.springframework.cache=INFO