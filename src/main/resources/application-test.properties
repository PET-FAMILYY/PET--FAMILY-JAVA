# Perfil de teste: banco H2 em memoria, isolado do arquivo usado
# em desenvolvimento local. O Flyway roda todas as migrations
# (h2/V1 + common/V2..V6) contra este banco descartavel.
spring.datasource.url=jdbc:h2:mem:petfamily_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Console H2 desligado nos testes (a rota /h2-console fica protegida)
spring.h2.console.enabled=false

jwt.secret=test-secret-key-not-for-production-use-only-min-32-bytes
jwt.expiration-ms=3600000
cors.allowed-origins=*