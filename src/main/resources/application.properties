# ===================================
# Pet Family API - Configurações
# ===================================

spring.application.name=Pet Family API
server.port=9090

# Perfil ativo por padrão: "dev" carrega dados de demonstração
# (ver DataInitializer). Para produção/homologação, defina
# SPRING_PROFILES_ACTIVE=prod (ou qualquer valor != dev) para
# desligar a carga de dados fictícios.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# H2 em arquivo: os dados persistem entre reinicializações locais.
# AUTO_SERVER=TRUE permite abrir o H2 Console (outra conexão) com
# a aplicação já rodando. O arquivo fica em ./data/petfamily.mv.db
# (ignorado pelo git).
spring.datasource.url=jdbc:h2:file:./data/petfamily;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate — o schema é 100% gerenciado pelo Flyway
# (src/main/resources/db/migration). ddl-auto=validate apenas
# confere se as entidades batem com as tabelas migradas; nunca
# cria/altera nada em runtime.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 Console (acessar em http://localhost:9090/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# SpringDoc / Swagger (acessar em http://localhost:9090/swagger-ui.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Segurança / JWT — o segredo e a expiração devem vir de variável
# de ambiente em qualquer ambiente real. O valor abaixo é apenas
# um fallback de desenvolvimento local.
jwt.secret=${JWT_SECRET:pet-family-dev-secret-troque-em-producao-min-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — em desenvolvimento aceita qualquer origem (o app Expo
# roda em endereços variáveis: emulador, dispositivo físico, Expo
# Go). Em produção, defina CORS_ALLOWED_ORIGINS com uma lista
# separada por vírgula.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.br.com.fiap.petfamily=INFO
logging.level.org.springframework.cache=DEBUG
