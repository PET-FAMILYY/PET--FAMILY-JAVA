# ===================================
# Pet Family API - Configurações COMUNS a todos os perfis
# ===================================
# O que muda por ambiente (banco, console H2, segredos) fica em:
#   application-dev.properties   -> H2 em arquivo + console H2 + dados demo
#   application-prod.properties  -> PostgreSQL compartilhado, sem console H2
#   (testes: src/test/resources/application-test.properties -> H2 em memória)

spring.application.name=Pet Family API
server.port=${PORT:9090}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Perfil padrão: "dev" (conveniência local). Em qualquer ambiente real
# defina SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev
# JPA / Hibernate ? o schema é 100% gerenciado pelo Flyway.
# ddl-auto=validate apenas confere se as entidades batem com as tabelas
# migradas; nunca cria/altera nada em runtime.
# (O dialect é detectado automaticamente a partir do driver.)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway ? migrations comuns + a pasta específica do banco em uso
# ({vendor} = h2 | postgresql). Só a V1 muda entre bancos (DOUBLE x
# DOUBLE PRECISION); da V2 em diante o SQL é portável e fica em "common".
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=false

# H2 Console: DESLIGADO por padrão. Só o perfil "dev" liga (ver
# application-dev.properties). O SecurityConfig só libera a rota
# /h2-console quando esta propriedade está true.
spring.h2.console.enabled=false

# SpringDoc / Swagger (acessar em http://localhost:9090/swagger-ui.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Cache Caffeine
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Expiração do token (o segredo JWT é definido por perfil)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.br.com.fiap.petfamily=INFO