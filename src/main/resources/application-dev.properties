# ===================================
# Perfil DEV ? uso local
# ===================================

# H2 em arquivo: os dados persistem entre reinicializações locais.
# AUTO_SERVER=TRUE permite abrir o H2 Console com a aplicação rodando.
# O arquivo fica em ./data/petfamily.mv.db (ignorado pelo git).
spring.datasource.url=jdbc:h2:file:./data/petfamily;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Banco de dev legado (criado antes do Flyway) é "baselinado" em vez de falhar.
spring.flyway.baseline-on-migrate=true

# H2 Console ? SOMENTE em dev (http://localhost:9090/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Segredo apenas para desenvolvimento local (nunca usar em prod)
jwt.secret=${JWT_SECRET:pet-family-dev-secret-troque-em-producao-min-32-bytes}

# Em dev aceita qualquer origem (Expo roda em endereços variáveis)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

logging.level.org.springframework.cache=DEBUG